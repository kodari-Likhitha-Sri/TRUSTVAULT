{% extends "base.html" %}

{% block title %}404 - Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="vault-card p-5">
                <div class="text-cyan display-1 mb-3">
                    <i class="bi bi-compass"></i>
                </div>
                <h1 class="text-white fw-bold mb-2">404 - Page Not Found</h1>
                <p class="text-muted mb-4">
                    The requested file, page, or document could not be located in the TrustVault registry. It may have been moved or permanently deleted.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary-vault">
                        <i class="bi bi-house-door-fill"></i> Return Home
                    </a>
                    <a href="{{ url_for('main.search') }}" class="btn btn-secondary-vault">
                        <i class="bi bi-search"></i> Search Vault
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
